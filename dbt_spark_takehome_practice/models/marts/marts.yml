version: 2

models:
  - name: int_user_daily_metrics
    description: Daily completed transaction metrics by user.
    columns:
      - name: user_id
        tests:
          - not_null
      - name: txn_date
        tests:
          - not_null
      - name: completed_txn_count
        tests:
          - not_null

  - name: fct_suspicious_transactions
    description: Completed transactions that match one or more suspicious rules.
    columns:
      - name: txn_id
        tests:
          - not_null
          - unique

      - name: user_id
        tests:
          - not_null

      - name: suspicious_flag
        tests:
          - accepted_values:
              values: [1]
              quote: false
